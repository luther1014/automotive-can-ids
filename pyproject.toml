[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "can-ids-starter"
version = "0.1.0"
description = "Learning-oriented, reproducible CAN intrusion detection baselines"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
canids = "canids.cli:main"
